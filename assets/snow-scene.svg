<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a skid steer with a snow blower attachment clearing a snowy driveway">
  <defs>
    <linearGradient id="winterSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfd9e6"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="420" fill="url(#winterSky)"/>
  <!-- distant houses -->
  <g opacity="0.5" fill="#9fb0c2">
    <rect x="60" y="150" width="120" height="80" />
    <polygon points="60,150 120,110 180,150"/>
    <rect x="240" y="170" width="100" height="60"/>
    <polygon points="240,170 290,135 340,170"/>
    <rect x="620" y="160" width="110" height="70"/>
    <polygon points="620,160 675,120 730,160"/>
  </g>
  <!-- snow ground -->
  <rect x="0" y="290" width="900" height="130" fill="#ffffff"/>
  <path d="M0 290 Q 225 270 450 292 T 900 288 L900 300 L0 300 Z" fill="#e7edf3"/>
  <!-- cleared path -->
  <rect x="0" y="345" width="900" height="45" fill="#c9d3dc"/>

  <!-- falling snow -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="120" cy="60" r="4"/>
    <circle cx="260" cy="100" r="3"/>
    <circle cx="400" cy="50" r="5"/>
    <circle cx="520" cy="120" r="3"/>
    <circle cx="660" cy="70" r="4"/>
    <circle cx="780" cy="110" r="3"/>
    <circle cx="60" cy="180" r="3"/>
    <circle cx="840" cy="190" r="4"/>
  </g>

  <!-- skid steer with snow blower -->
  <g transform="translate(330,220)">
    <rect x="30" y="70" width="140" height="58" rx="10" fill="#1f3d2b"/>
    <rect x="42" y="35" width="65" height="45" rx="6" fill="#2a2f28"/>
    <rect x="49" y="41" width="51" height="26" rx="3" fill="#cfe0d6"/>
    <circle cx="60" cy="140" r="28" fill="#14171a"/>
    <circle cx="60" cy="140" r="13" fill="#4d5750"/>
    <circle cx="145" cy="140" r="28" fill="#14171a"/>
    <circle cx="145" cy="140" r="13" fill="#4d5750"/>
    <!-- snow blower attachment -->
    <g transform="translate(-70,55)">
      <rect x="0" y="0" width="30" height="55" rx="6" fill="#e8710a"/>
      <circle cx="15" cy="8" r="14" fill="#c25e07"/>
      <path d="M15 -6 L26 4 L4 4 Z" fill="#fff" opacity="0.85"/>
    </g>
    <rect x="-40" y="65" width="70" height="10" fill="#c25e07"/>
    <!-- snow spray -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="-90" cy="10" r="6"/>
      <circle cx="-105" cy="-10" r="5"/>
      <circle cx="-80" cy="-25" r="4"/>
      <circle cx="-60" cy="-35" r="5"/>
      <circle cx="-40" cy="-20" r="4"/>
      <circle cx="-100" cy="20" r="4"/>
    </g>
  </g>
</svg>
